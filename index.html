<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード生成ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .settings-section {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 2px solid #dee2e6;
        }

        .section-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #495057;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 3px solid #007bff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-weight: 600;
            color: #495057;
            font-size: 0.95em;
        }

        .label-description {
            font-size: 0.8em;
            color: #6c757d;
            font-weight: normal;
            margin-top: 3px;
            line-height: 1.4;
        }
        
        select {
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #ced4da;
            font-size: 15px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        select:hover {
            border-color: #007bff;
            transform: translateY(-1px);
        }

        select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }

        .action-section {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 16px 32px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
            justify-content: center;
        }

        button:active {
            transform: translateY(2px);
        }

        #generateBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        #generateBtn:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
            transform: translateY(-3px);
        }
        
        #copyBtn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
        
        #copyBtn:hover:not(:disabled) {
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.6);
            transform: translateY(-3px);
        }
        
        #copyBtn:disabled {
            background: linear-gradient(135deg, #6c757d, #adb5bd);
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }
        
        textarea {
            width: 100%;
            height: 450px;
            padding: 20px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            line-height: 1.8;
            border: 2px solid #ced4da;
            border-radius: 10px;
            resize: vertical;
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            transition: all 0.2s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
            background: white;
        }
        
        .status {
            margin-bottom: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            display: none;
        }

        .status.show {
            display: block;
        }
        
        .status.success {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .status.info {
            background: linear-gradient(135deg, #d1ecf1, #bee5eb);
            color: #0c5460;
            border: 2px solid #bee5eb;
        }

        .status.error {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e9ecef;
            text-align: center;
            color: #6c757d;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .action-section {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 パスワード生成ツール</h1>
    <p class="subtitle">セキュアで高品質なパスワードを簡単に生成</p>

    <!-- 基本設定 -->
    <div class="settings-section">
        <div class="section-title">
            <span>⚙️</span>
            <span>基本設定</span>
        </div>
        <div class="settings-grid">
            <div class="control-group">
                <label for="countSelect">
                    生成数
                    <div class="label-description">生成するパスワードの個数を選択</div>
                </label>
                <select id="countSelect"></select>
            </div>

            <div class="control-group">
                <label for="lengthSelect">
                    パスワード長
                    <div class="label-description">各パスワードの文字数を選択</div>
                </label>
                <select id="lengthSelect"></select>
            </div>

            <div class="control-group">
                <label for="symbolSelect">
                    記号の使用
                    <div class="label-description">パスワードに記号を含めるかどうか</div>
                </label>
                <select id="symbolSelect">
                    <option value="yes">使用する（推奨）</option>
                    <option value="no">使用しない</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 除外設定 -->
    <div class="settings-section">
        <div class="section-title">
            <span>🚫</span>
            <span>除外設定</span>
        </div>
        <div class="settings-grid">
            <div class="control-group">
                <label for="excludeSymbolSelect">
                    除外する記号
                    <div class="label-description">使用しない記号の組み合わせを選択</div>
                </label>
                <select id="excludeSymbolSelect"></select>
            </div>

            <div class="control-group">
                <label for="excludeCharSelect">
                    除外する文字・数字
                    <div class="label-description">紛らわしい文字を除外して可読性を向上</div>
                </label>
                <select id="excludeCharSelect"></select>
            </div>
        </div>
    </div>

    <!-- 連続制限設定 -->
    <div class="settings-section">
        <div class="section-title">
            <span>📏</span>
            <span>連続文字制限</span>
        </div>
        <div class="settings-grid">
            <div class="control-group">
                <label for="consecutiveUpperSelect">
                    大文字の連続許可数
                    <div class="label-description">例: 3を選択すると「AAA」までOK、「AAAA」はNG</div>
                </label>
                <select id="consecutiveUpperSelect"></select>
            </div>

            <div class="control-group">
                <label for="consecutiveLowerSelect">
                    小文字の連続許可数
                    <div class="label-description">例: 3を選択すると「aaa」までOK、「aaaa」はNG</div>
                </label>
                <select id="consecutiveLowerSelect"></select>
            </div>
        </div>
    </div>

    <!-- 生成・コピーボタン -->
    <div class="action-section">
        <button id="generateBtn" onclick="generatePasswords()">
            <span>🎲</span>
            <span>パスワード生成</span>
        </button>
        <button id="copyBtn" onclick="copyToClipboard()" disabled>
            <span>📋</span>
            <span>全てをコピー</span>
        </button>
    </div>

    <!-- ステータスメッセージ -->
    <div id="statusMsg" class="status"></div>

    <!-- 結果表示エリア -->
    <textarea id="resultArea" readonly placeholder="「パスワード生成」ボタンをクリックすると、生成されたパスワードがここに1行につき1つずつ表示されます..."></textarea>

    <div class="footer">
        🔒 このツールはブラウザ上でローカル動作し、生成されたパスワードは外部に送信されません
    </div>
</div>

<script>
    // ==========================================
    // 文字セットと設定オプションの定義
    // ==========================================
    const CHAR_SETS = {
        upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
        lower: "abcdefghijklmnopqrstuvwxyz",
        number: "0123456789",
        symbol: "!@#$%^&*()_+-=[]{}|;:,.<>?~`"
    };

    const EXCLUDE_OPTIONS = {
        symbols: [
            { value: "!$%&=", label: "! $ % & = （初期値・推奨）" },
            { value: "", label: "除外なし（全て使用）" },
            { value: "!@#$%", label: "! @ # $ %" },
            { value: "!$%&=^*", label: "! $ % & = ^ *" },
            { value: "<>[]{}|()", label: "< > [ ] { } | ( )" },
            { value: "`~\"'", label: "`~\"'（引用符系）" },
            { value: "!@#$%^&*()", label: "! @ # $ % ^ & * ( )（多数除外）" }
        ],
        
        chars: [
            { value: "0OI1l", label: "0 O I 1 l （初期値・強く推奨）" },
            { value: "", label: "除外なし（全て使用）" },
            { value: "0O", label: "0 O のみ" },
            { value: "I1l", label: "I 1 l のみ" },
            { value: "0OI1lS5", label: "0 O I 1 l S 5" },
            { value: "0OI1lZ2B8", label: "0 O I 1 l Z 2 B 8（多数除外）" }
        ]
    };

    // ==========================================
    // 初期化処理
    // ==========================================
    window.onload = function() {
        initializeAllSelects();
    };

    /**
     * 全ての選択肢を初期化
     */
    function initializeAllSelects() {
        // 生成数の選択肢（30-60）
        const countSelect = document.getElementById('countSelect');
        for (let i = 30; i <= 60; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.text = `${i}個`;
            if (i === 50) option.selected = true; // デフォルト値
            countSelect.appendChild(option);
        }

        // パスワード長の選択肢（8-32）
        const lengthSelect = document.getElementById('lengthSelect');
        for (let i = 8; i <= 32; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.text = `${i}文字`;
            if (i === 13) option.selected = true; // 初期値
            lengthSelect.appendChild(option);
        }

        // 連続許可数の選択肢（1-10）
        const consecutiveUpperSelect = document.getElementById('consecutiveUpperSelect');
        const consecutiveLowerSelect = document.getElementById('consecutiveLowerSelect');
        
        for (let i = 1; i <= 10; i++) {
            // 大文字連続制限
            const optionUpper = document.createElement('option');
            optionUpper.value = i;
            optionUpper.text = `${i}文字まで許可`;
            if (i === 3) optionUpper.selected = true; // 初期値: 3文字まで許可
            consecutiveUpperSelect.appendChild(optionUpper);

            // 小文字連続制限
            const optionLower = document.createElement('option');
            optionLower.value = i;
            optionLower.text = `${i}文字まで許可`;
            if (i === 3) optionLower.selected = true; // 初期値: 3文字まで許可
            consecutiveLowerSelect.appendChild(optionLower);
        }

        // 除外記号の選択肢
        const excludeSymbolSelect = document.getElementById('excludeSymbolSelect');
        EXCLUDE_OPTIONS.symbols.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.value;
            option.text = opt.label;
            excludeSymbolSelect.appendChild(option);
        });

        // 除外文字の選択肢
        const excludeCharSelect = document.getElementById('excludeCharSelect');
        EXCLUDE_OPTIONS.chars.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.value;
            option.text = opt.label;
            excludeCharSelect.appendChild(option);
        });
    }

    /**
     * 現在のUI設定を取得
     */
    function getCurrentConfig() {
        return {
            count: parseInt(document.getElementById('countSelect').value),
            passwordLength: parseInt(document.getElementById('lengthSelect').value),
            includeSymbols: document.getElementById('symbolSelect').value === 'yes',
            excludedSymbols: document.getElementById('excludeSymbolSelect').value,
            excludedChars: document.getElementById('excludeCharSelect').value,
            maxConsecutiveUpper: parseInt(document.getElementById('consecutiveUpperSelect').value),
            maxConsecutiveLower: parseInt(document.getElementById('consecutiveLowerSelect').value)
        };
    }

    /**
     * 指定された文字セットから除外文字を取り除く
     */
    function filterChars(sourceChars, excludedChars) {
        if (!excludedChars) return sourceChars;
        return sourceChars.split('').filter(c => !excludedChars.includes(c)).join('');
    }

    /**
     * 暗号学的に安全な乱数で文字を選択
     */
    function getRandomChar(charSet) {
        if (charSet.length === 0) return '';
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return charSet[array[0] % charSet.length];
    }

    /**
     * ランダムな整数を取得
     */
    function getRandomInt(min, max) {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return min + (array[0] % (max - min + 1));
    }

    /**
     * Fisher-Yates シャッフルアルゴリズム
     */
    function shuffleArray(array) {
        const result = [...array];
        for (let i = result.length - 1; i > 0; i--) {
            const j = getRandomInt(0, i);
            [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
    }

    /**
     * 単一のパスワードを生成
     */
    function generateSinglePassword(config) {
        // 使用可能な文字プールを構築
        let poolUpper = filterChars(CHAR_SETS.upper, config.excludedChars);
        let poolLower = filterChars(CHAR_SETS.lower, config.excludedChars);
        let poolNumber = filterChars(CHAR_SETS.number, config.excludedChars);
        let poolSymbol = "";

        if (config.includeSymbols) {
            let tempSymbols = filterChars(CHAR_SETS.symbol, config.excludedSymbols);
            poolSymbol = filterChars(tempSymbols, config.excludedChars);
        }

        // 使用可能文字の検証
        if (poolLower.length === 0) {
            throw new Error("使用可能な小文字がありません");
        }
        if (poolUpper.length === 0) {
            throw new Error("使用可能な大文字がありません");
        }
        if (poolNumber.length === 0) {
            throw new Error("使用可能な数字がありません");
        }

        let password = "";
        let isValid = false;
        let attempts = 0;
        const maxAttempts = 1000;

        while (!isValid && attempts < maxAttempts) {
            attempts++;

            // 1文字目は必ず小文字
            password = getRandomChar(poolLower);

            // 残りの文字を構成
            let remainingChars = [];
            let remainingLength = config.passwordLength - 1;

            // 必須: 大文字を最低1つ追加
            remainingChars.push({ type: 'upper', char: getRandomChar(poolUpper) });

            // 必須: 数字を最低2つ追加
            remainingChars.push({ type: 'number', char: getRandomChar(poolNumber) });
            if (remainingLength > 1) {
                remainingChars.push({ type: 'number', char: getRandomChar(poolNumber) });
            }

            // 記号を使用する場合は1つ追加
            if (config.includeSymbols && poolSymbol.length > 0 && remainingLength > 2) {
                remainingChars.push({ type: 'symbol', char: getRandomChar(poolSymbol) });
            }

            // 残りの文字をランダムに追加
            while (remainingChars.length < remainingLength) {
                let allChars = poolUpper + poolLower + poolNumber;
                if (config.includeSymbols && poolSymbol.length > 0) {
                    allChars += poolSymbol;
                }
                
                let randomChar = getRandomChar(allChars);
                let type = 'lower';
                if (poolUpper.includes(randomChar)) type = 'upper';
                else if (poolNumber.includes(randomChar)) type = 'number';
                else if (poolSymbol.includes(randomChar)) type = 'symbol';
                
                remainingChars.push({ type: type, char: randomChar });
            }

            // シャッフルして結合
            remainingChars = shuffleArray(remainingChars);
            password += remainingChars.map(c => c.char).join('');

            // 検証
            if (validatePassword(password, config, poolUpper, poolLower, poolNumber)) {
                isValid = true;
            }
        }

        if (!isValid) {
            throw new Error(`パスワード生成に失敗しました（${attempts}回試行）`);
        }

        return password;
    }

    /**
     * パスワードが要件を満たしているかを検証
     */
    function validatePassword(pwd, config, upperPool, lowerPool, numberPool) {
        // 1. 小文字で始まることを確認
        if (!lowerPool.includes(pwd[0])) return false;

        // 2. 数字が2つ以上含まれることを確認
        let numberCount = 0;
        for (let char of pwd) {
            if (numberPool.includes(char)) numberCount++;
        }
        if (numberCount < 2) return false;

        // 3. 大文字、小文字、数字が必ず含まれることを確認
        let hasUpper = false;
        let hasLower = false;
        
        for (let char of pwd) {
            if (upperPool.includes(char)) hasUpper = true;
            if (lowerPool.includes(char)) hasLower = true;
        }
        if (!hasUpper || !hasLower) return false;

        // 4. 大文字の連続制限を確認
        if (hasExcessiveConsecutive(pwd, upperPool, config.maxConsecutiveUpper)) return false;

        // 5. 小文字の連続制限を確認
        if (hasExcessiveConsecutive(pwd, lowerPool, config.maxConsecutiveLower)) return false;

        return true;
    }

    /**
     * 指定文字種が制限を超えて連続しているかチェック
     */
    function hasExcessiveConsecutive(password, charSet, maxAllowed) {
        let consecutiveCount = 0;
        
        for (let char of password) {
            if (charSet.includes(char)) {
                consecutiveCount++;
                if (consecutiveCount > maxAllowed) {
                    return true; // 制限を超えた
                }
            } else {
                consecutiveCount = 0;
            }
        }
        return false;
    }

    /**
     * メイン処理: 複数パスワードの生成
     */
    function generatePasswords() {
        try {
            const config = getCurrentConfig();
            const results = [];
            
            showStatus('⏳ パスワードを生成しています...', 'info');
            
            // UI更新のため少し遅延
            setTimeout(() => {
                try {
                    for (let i = 0; i < config.count; i++) {
                        results.push(generateSinglePassword(config));
                    }

                    document.getElementById('resultArea').value = results.join('\n');
                    document.getElementById('copyBtn').disabled = false;
                    
                    showStatus(`✅ ${config.count}個のパスワードを正常に生成しました`, 'success');
                } catch (error) {
                    showStatus(`❌ エラー: ${error.message}`, 'error');
                    document.getElementById('resultArea').value = '';
                    document.getElementById('copyBtn').disabled = true;
                }
            }, 100);
        } catch (error) {
            showStatus(`❌ 設定エラー: ${error.message}`, 'error');
        }
    }

    /**
     * クリップボードへコピー
     */
    function copyToClipboard() {
        const textarea = document.getElementById('resultArea');
        if (!textarea.value.trim()) {
            showStatus('⚠️ コピーするパスワードがありません', 'info');
            return;
        }

        textarea.select();
        textarea.setSelectionRange(0, 99999);

        try {
            document.execCommand('copy');
            showStatus('✅ 全てのパスワードをクリップボードにコピーしました！', 'success');
        } catch (err) {
            showStatus('❌ コピーに失敗しました', 'error');
        }
        
        window.getSelection().removeAllRanges();
    }

    /**
     * ステータスメッセージの表示
     */
    function showStatus(message, type = 'info') {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.textContent = message;
        statusDiv.className = `status ${type} show`;
        
        // 4秒後に自動消去
        setTimeout(() => {
            statusDiv.classList.remove('show');
        }, 4000);
    }
</script>

</body>
</html>
